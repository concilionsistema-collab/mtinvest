# Deploy da API (apps/api) no Render - Blueprint.
#
# Por que a API vai pra ca e o portal vai pra Vercel: o portal e Next.js
# (a Vercel roda Next melhor que qualquer outra plataforma, no plano free),
# enquanto a API e um processo Nest de longa duracao que precisa manter uma
# pool de conexoes com o Postgres - coisa que ambiente serverless faz mal.
#
# O banco NAO esta declarado aqui de proposito: ele ja existe no Supabase
# (ver DEPLOY.md). Declarar um Postgres do Render criaria um segundo banco,
# vazio, e o sistema passaria a apontar pro lugar errado.
services:
  - type: web
    name: concilion-crm-api
    runtime: node
    plan: free
    region: oregon
    # O repositorio inteiro e um workspace npm; o build precisa rodar da raiz
    # pra que @crm/shared seja resolvido por link de workspace. packages/shared
    # tem que ser compilado ANTES da API - a API importa de '@crm/shared', que
    # aponta pra dist/index.js (ver packages/shared/package.json "main").
    #
    # 'prisma generate' explicito aqui, e nao no script "build" de apps/api:
    # node_modules/.prisma nao e versionado, entao sem isto o Prisma Client
    # nao existe no ambiente do Render e a API nao sobe. Fica no comando de
    # deploy (e nao no package.json) porque, na maquina de desenvolvimento, o
    # generate falha com EPERM sempre que a API esta rodando - o processo Node
    # mantem o query engine (.dll.node) aberto, e o Prisma nao consegue
    # substituir o arquivo. Deixar aqui evita quebrar o build local.
    buildCommand: npm ci && npm run build --workspace=packages/shared && npx prisma generate --schema=apps/api/prisma/schema.prisma && npm run build --workspace=apps/api
    startCommand: npm run start:prod --workspace=apps/api
    # /health e @Public() e @SkipThrottle() (ver modules/health) - existe
    # exatamente pra isto. No plano free o servico hiberna apos 15 min sem
    # trafego; o health check do Render NAO impede a hibernacao.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # Os tres abaixo sao definidos manualmente no painel do Render
      # (sync: false = "nao versionar valor neste arquivo"). DATABASE_URL e
      # JWT_SECRET sao segredos e nunca devem entrar no repositorio;
      # CORS_ORIGIN so e conhecida depois que a Vercel gera o dominio do
      # portal. Ver DEPLOY.md, secao "Variaveis de ambiente".
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
